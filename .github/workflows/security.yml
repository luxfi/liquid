name: Security

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:
  schedule:
    # Run weekly on Sunday at midnight
    - cron: '0 0 * * 0'

env:
  # The only profile this tree compiles under. profile.test sets via_ir = false
  # and Liquid.sol runs out of stack without it.
  FOUNDRY_PROFILE: default

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # SLITHER - Static Analysis
  # ═══════════════════════════════════════════════════════════════════════════
  slither:
    name: Slither Analysis
    runs-on: lux-build-amd64
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: forge build --build-info

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: 'src/'
          slither-args: '--exclude-dependencies --exclude-informational --sarif results.sarif'
          fail-on: medium
          sarif: results.sarif

      - name: Create empty SARIF if missing
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Slither","version":"0.0.0"}},"results":[]}]}' > results.sarif
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        if: always()

      # Findings are gated once, by the step above. --fail-none keeps this one to
      # writing the artifact, while a crashed slither still stops the job.
      - name: Create Slither Report
        if: always()
        run: |
          slither src/ --exclude-dependencies --fail-none --json slither-report.json
          echo "## Slither Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f slither-report.json ]; then
            echo "See artifacts for detailed report" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Slither Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: |
            slither-report.json
            results.sarif

  # ═══════════════════════════════════════════════════════════════════════════
  # ECHIDNA - Fuzzing
  # ═══════════════════════════════════════════════════════════════════════════
  echidna:
    name: Echidna Fuzzing
    runs-on: lux-build-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: forge build

      - name: Install Echidna
        run: |
          wget https://github.com/crytic/echidna/releases/download/v2.2.5/echidna-2.2.5-x86_64-linux.tar.gz
          tar -xzf echidna-2.2.5-x86_64-linux.tar.gz
          sudo mv echidna /usr/local/bin/

      # Echidna drives contracts that declare echidna_ properties. Deriving the
      # target list from the source keeps it from rotting, and an empty list is
      # reported rather than passed over, which is what a missing glob used to do.
      - name: Run Echidna on critical contracts
        shell: bash
        run: |
          echo "## Echidna Fuzzing Results" >> $GITHUB_STEP_SUMMARY

          if ! targets=$(grep -rl 'function echidna_' src/); then
            echo "No echidna harness in src/: expected contracts declaring 'function echidna_' properties." >&2
            exit 1
          fi

          for file in $targets; do
            name=$(basename "$file" .sol)
            echo "Running Echidna on $name" >> $GITHUB_STEP_SUMMARY
            echidna . --contract "$name" --config echidna.yaml --test-mode assertion
          done

      - name: Upload Echidna corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echidna-corpus
          path: crytic-export/
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # MEDUSA - Fast Parallel Fuzzing (Trail of Bits)
  # ═══════════════════════════════════════════════════════════════════════════
  medusa:
    name: Medusa Fuzzing
    runs-on: lux-build-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: forge build

      - name: Install Medusa
        run: |
          # Install Go
          wget https://go.dev/dl/go1.22.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.22.0.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin

          # Install Medusa
          go install github.com/crytic/medusa@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      # medusa.json is committed and carries its own timeout, so the budget and
      # the targets both live there. It sets stopOnNoTests, meaning medusa says
      # so itself when nothing is wired up to fuzz.
      - name: Run Medusa fuzzing
        shell: bash
        run: |
          export PATH=$PATH:$HOME/go/bin
          echo "## Medusa Fuzzing Results" >> $GITHUB_STEP_SUMMARY

          medusa fuzz --config medusa.json

          echo "Medusa fuzzing completed" >> $GITHUB_STEP_SUMMARY

      - name: Upload Medusa corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medusa-corpus
          path: |
            medusa-corpus/
            crytic-export/
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # SEMGREP - SAST
  # ═══════════════════════════════════════════════════════════════════════════
  semgrep:
    name: Semgrep SAST
    runs-on: lux-build-amd64
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/solidity
            p/smart-contracts
            p/security-audit
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # The Solidity packs are noisy at info and warning, so the job gates on
      # error-severity rules only and --error turns a finding into a red build.
      - name: Run Semgrep (local rules)
        shell: bash
        run: |
          pip install semgrep
          echo "## Semgrep Analysis Results" >> $GITHUB_STEP_SUMMARY

          semgrep scan --config p/solidity --config p/smart-contracts \
            --severity ERROR --error \
            --sarif --output semgrep-results.sarif \
            src/

          echo "Semgrep scan completed" >> $GITHUB_STEP_SUMMARY

      - name: Create empty SARIF if missing
        if: always()
        run: |
          if [ ! -f semgrep-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","version":"0.0.0"}},"results":[]}]}' > semgrep-results.sarif
          fi

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        if: always()

  # ═══════════════════════════════════════════════════════════════════════════
  # CODEQL - Deep Analysis
  # ═══════════════════════════════════════════════════════════════════════════
  codeql:
    name: CodeQL Analysis
    runs-on: lux-build-amd64
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: +security-extended

      - name: Build for CodeQL
        run: |
          # CodeQL doesn't directly support Solidity, but we can analyze JS/TS
          # deployment scripts and any hardhat/foundry config files
          echo "Building for CodeQL analysis..."

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ═══════════════════════════════════════════════════════════════════════════
  # ADERYN - Rust-based Solidity Analyzer
  # ═══════════════════════════════════════════════════════════════════════════
  aderyn:
    name: Aderyn Analysis
    runs-on: lux-build-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: forge build

      - name: Install Aderyn
        run: |
          curl -L https://raw.githubusercontent.com/Cyfrin/aderyn/main/cyfrinup/install | bash
          source ~/.bashrc
          ~/.cyfrin/bin/cyfrinup
          echo "$HOME/.cyfrin/bin" >> $GITHUB_PATH

      # Aderyn exits 0 whatever it finds, so the count in its own summary table
      # is the verdict. Tests and mocks are excluded to match forge lint and
      # .slither.config.json, leaving the production contracts.
      - name: Run Aderyn
        shell: bash
        run: |
          export PATH=$PATH:$HOME/.cyfrin/bin
          echo "## Aderyn Analysis Results" >> $GITHUB_STEP_SUMMARY

          aderyn . --src src/ -x test,mocks --output aderyn-report.md
          cat aderyn-report.md >> $GITHUB_STEP_SUMMARY

          if grep -qE '^\| High \| [1-9]' aderyn-report.md; then
            grep -E '^\| High \|' aderyn-report.md >&2
            exit 1
          fi

      - name: Upload Aderyn Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: aderyn-report.md
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # FORGE FUZZ - Native Foundry Fuzzing
  # ═══════════════════════════════════════════════════════════════════════════
  forge-fuzz:
    name: Forge Fuzz Tests
    runs-on: lux-build-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # The suite is selected by the Makefile so CI and a laptop run the same set.
      # shell: bash turns on pipefail; without it tee returns 0 over a failed run.
      - name: Run Forge fuzz tests
        shell: bash
        run: make test-fuzz 2>&1 | tee fuzz-results.txt
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      - name: Summarize Fuzz Tests
        if: always()
        run: |
          echo "## Forge Fuzz Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 fuzz-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Fuzz Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-fuzz-results
          path: fuzz-results.txt

  # ═══════════════════════════════════════════════════════════════════════════
  # HALMOS - Symbolic Execution
  # ═══════════════════════════════════════════════════════════════════════════
  halmos:
    name: Halmos Symbolic Execution
    runs-on: lux-build-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # make halmos installs halmos into .venv and scopes the run to the four
      # Halmos* contracts. A property that neither proves nor finds a
      # counterexample inside the solver budget counts as failed, by design.
      - name: Run Halmos
        shell: bash
        run: make halmos 2>&1 | tee halmos-results.txt

      - name: Summarize Halmos
        if: always()
        run: |
          echo "## Halmos Symbolic Execution Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 halmos-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Halmos Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halmos-results
          path: halmos-results.txt

  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════
  security-summary:
    name: Security Summary
    needs: [slither, echidna, medusa, semgrep, codeql, aderyn, forge-fuzz, halmos]
    runs-on: lux-build-amd64
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports/

      - name: Generate Summary
        run: |
          echo "# Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Slither | ${{ needs.slither.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Echidna | ${{ needs.echidna.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Medusa | ${{ needs.medusa.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Aderyn | ${{ needs.aderyn.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Forge Fuzz | ${{ needs.forge-fuzz.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Halmos | ${{ needs.halmos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See individual job logs and artifacts for detailed results." >> $GITHUB_STEP_SUMMARY

      - name: Upload Combined Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-combined
          path: security-reports/
