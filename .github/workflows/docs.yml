name: Docs
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/luxfi/liquid-docs
      context: docs
      dockerfile: Dockerfile
      platforms: linux/amd64
    secrets: inherit
